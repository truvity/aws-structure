# Tag-triggered release through truvity/ci-workflows release-public.yaml.
#
# The tag is the Go module's version, and the release carries the awsorgctl
# binaries.
version: 2

project_name: aws-structure

builds:
  - id: awsorgctl
    main: ./cmd/awsorgctl
    binary: awsorgctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: awsorgctl
    ids: [awsorgctl]
    formats: [tar.gz]
    name_template: "awsorgctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^ci"
      - "^docs"
      - "^test"

release:
  github: {}
  header: |
    ## aws-structure {{ .Tag }}

    Go module: `go get github.com/truvity/aws-structure@{{ .Tag }}`.
    CLI: the `awsorgctl` archives below, or `go install github.com/truvity/aws-structure/cmd/awsorgctl@{{ .Tag }}`.
